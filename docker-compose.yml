services:
  backend:
    build:
      context: ./backend
    container_name: yantragen-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: yantragen-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
